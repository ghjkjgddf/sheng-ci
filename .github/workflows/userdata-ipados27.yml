# sheng / iPadOS 27.0.1 (24A446) userdata image: the OS and SystemOS volumes behind the SHNGROOT
# manifest, as a full-partition Android sparse image, zstd-compressed and split for the artifact limit.
#
# Same pinned sources and same non-strict path as the boot image build. Needs the repository secret
# UNIXNU_UNIQUE_CHIP_ID only for the platform identity of the payload-independent steps.
name: sheng ipados 27 userdata image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sheng-userdata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      UNIXNU_IPSW_JOBS: 16
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 97437dcf7389484a0eeaa8067725ce743aff18ef
          path: UniXNU
          submodules: recursive

      - name: device at the guide's verified commit
        run: |
          git init device
          git -C device remote add origin https://github.com/KuriyamaMirai08/UniXNU-sheng.git
          git -C device fetch --depth 1 origin a9f0500af098f8aee87c86a571638daee92caf26
          git -C device checkout --detach FETCH_HEAD
          git -C device submodule update --init --recursive
          test "$(git -C device rev-parse HEAD)" = a9f0500af098f8aee87c86a571638daee92caf26

      - name: tools
        run: |
          brew install dtc mtools ninja cmake zstd blacktop/tap/ipsw
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install cryptography
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: fetch the sources
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: python3 unixnu fetch -D ../device --os 27

      - name: use a DONT_CARE-aware sparse generator
        working-directory: device
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/make-userdata-full.py')
          text = path.read_text()
          if 'DONT_CARE' in text:
              print('generator already patched')
              raise SystemExit(0)
          old_data = """    def data(self, buffer):
              assert len(buffer) % BLOCK == 0
              for at in range(0, len(buffer), BLOCK):
                  block = buffer[at:at + BLOCK]
                  if block == ZERO:
                      self.flush_raw()
                      self.zero_run += 1
                  else:
                      self.flush_zero()
                      self.raw += block
                      self.raw_blocks += 1
                      if self.raw_blocks == MAX_RAW:
                          self.flush_raw()
              self.blocks += len(buffer) // BLOCK
          """
          new_data = """    def data(self, buffer):
              # Interior zeros stay raw: fastboot turns FILL-of-zero chunks into "don't care" regions and
              # computes byte sizes that are not block multiples (remote: Bad Buffer Size). Window sha256
              # covers these zeros as well.
              assert len(buffer) % BLOCK == 0
              for at in range(0, len(buffer), BLOCK):
                  self.raw += buffer[at:at + BLOCK]
                  self.raw_blocks += 1
                  if self.raw_blocks == MAX_RAW:
                      self.flush_raw()
              self.blocks += len(buffer) // BLOCK
          """
          old_zeros = """    def zeros(self, count):
              self.flush_raw()
              self.zero_run += count
              self.blocks += count
          """
          new_zeros = """    def skip(self, count):
              self.flush_raw()
              self.flush_zero()
              if count:
                  self.out.write(struct.pack('<HHII', DONT_CARE, 0, count, 12))
                  self.chunks += 1
                  self.blocks += count
          """
          old_head = "RAW, FILL = 0xCAC1, 0xCAC2"
          new_head = "RAW, FILL, DONT_CARE = 0xCAC1, 0xCAC2, 0xCAC3"
          for old, new in ((old_data, new_data), (old_zeros, new_zeros), (old_head, new_head)):
              if old not in text:
                  raise SystemExit('generator text not found: ' + old.splitlines()[0])
              text = text.replace(old, new, 1)
          text = text.replace('writer.zeros(', 'writer.skip(')
          path.write_text(text)
          print('generator patched for DONT_CARE')
          PY
          python3 -m py_compile scripts/make-userdata-full.py

      - name: build the userdata raw image
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: |
          set -euo pipefail
          python3 unixnu build userdata --os 27 -D ../device

      - name: total partition size
        working-directory: UniXNU
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          board = tomllib.load(open('../device/board.toml', 'rb'))
          u = board['userdata']
          print('USERDATA_BYTES=%d' % ((u['last_lba'] - u['first_lba'] + 1) * u.get('lba_bytes', 4096)))
          PY

      - name: assemble the full-partition sparse image
        working-directory: device
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
        run: |
          set -euo pipefail
          target=../UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27
          mkdir -p artifacts
          python3 - "$target" > /tmp/dmgs <<'PY'
          import json, pathlib, plistlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          pins = json.loads((root / 'userdata/userdata-root.json').read_text())
          ipsw = root.parents[2] / 'ipsw'
          def total(path):
              info = plistlib.loads(subprocess.check_output(['hdiutil', 'imageinfo', '-plist', str(path)]))
              return info['Size Information']['Total Bytes']
          sizes = {}
          for path in sorted(ipsw.rglob('*.dmg')):
              sizes.setdefault(total(path), path)
          chosen = []
          for window in pins['windows']:
              path = sizes.get(window['size'])
              if path is None:
                  raise SystemExit(f"no .dmg for window {window['name']} size {window['size']}")
              chosen.append(str(path))
          print('\n'.join(chosen))
          PY
          dmgs=()
          while IFS= read -r line; do dmgs+=("$line"); done < /tmp/dmgs
          python3 scripts/make-userdata-full.py "${dmgs[0]}" "${dmgs[1]}" \
            "$target/userdata/userdata-root.json" "$USERDATA_BYTES" artifacts/userdata-full.sparse
          ls -lh artifacts
          zstd -T0 -3 --sparse artifacts/userdata-full.sparse -o artifacts/userdata-full.sparse.zst
          split -b 1900m -d -a 2 artifacts/userdata-full.sparse.zst artifacts/userdata-full.sparse.zst.part
          rm -f artifacts/userdata-full.sparse artifacts/userdata-full.sparse.zst
          cp "$target/userdata/userdata-root.json" artifacts/
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS.txt || true
          ls -lh artifacts

      - name: validate the sparse image before uploading
        working-directory: device
        run: |
          python3 - <<'PY'
          import struct
          types = {0xCAC1: 'RAW', 0xCAC2: 'FILL', 0xCAC3: 'SKIP'}
          path = 'artifacts/userdata-full.sparse'
          with open(path, 'rb') as f:
              header = f.read(28)
              magic, _, _, _, _, blk = struct.unpack('<IHHHHI', header[:16])
              total, chunks, _ = struct.unpack('<III', header[16:28])
              if magic != 0xED26FF3A:
                  raise SystemExit('not a sparse image')
              seen, blocks = {}, 0
              for _ in range(chunks):
                  ctype, _, count, size = struct.unpack('<HHII', f.read(12))
                  name = types.get(ctype, hex(ctype))
                  seen[name] = seen.get(name, 0) + 1
                  if name == 'FILL':
                      raise SystemExit('FILL chunk present; fastboot rejects those')
                  if name == 'SKIP' and size != 12:
                      raise SystemExit('SKIP chunk with payload')
                  f.seek(size - 12, 1)
                  blocks += count
          if blocks != total:
              raise SystemExit(f'block count {blocks} != header {total}')
          print('sparse ok:', seen, 'blocks', total, 'size', total * blk / 2**30, 'GiB')
          PY

      - name: upload parts 1/3
        uses: actions/upload-artifact@v4
        with:
          name: userdata-part-1
          retention-days: 5
          if-no-files-found: error
          path: |
            device/artifacts/userdata-full.sparse.zst.part00
            device/artifacts/userdata-full.sparse.zst.part01
            device/artifacts/userdata-full.sparse.zst.part02
            device/artifacts/userdata-root.json
            device/artifacts/SHA256SUMS.txt

      - name: upload parts 2/3
        uses: actions/upload-artifact@v4
        with:
          name: userdata-part-2
          retention-days: 5
          if-no-files-found: ignore
          path: |
            device/artifacts/userdata-full.sparse.zst.part03
            device/artifacts/userdata-full.sparse.zst.part04
            device/artifacts/userdata-full.sparse.zst.part05

      - name: upload parts 3/3
        uses: actions/upload-artifact@v4
        with:
          name: userdata-part-3
          retention-days: 5
          if-no-files-found: ignore
          path: |
            device/artifacts/userdata-full.sparse.zst.part06
            device/artifacts/userdata-full.sparse.zst.part07
            device/artifacts/userdata-full.sparse.zst.part08
            device/artifacts/userdata-full.sparse.zst.part09
